<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="830" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ag_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081e33"/>
      <stop offset="100%" stop-color="#051322"/>
    </linearGradient>

    <!-- Curve Line Gradient -->
    <linearGradient id="ag_line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="ag_area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ag_card"><rect width="830" height="300" rx="18"/></clipPath>

    <filter id="ag_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ag-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Verdana, Arial, sans-serif; }
    .ag-mono { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
  </style>

  <g clip-path="url(#ag_card)">
    <!-- Base Card -->
    <rect width="830" height="300" fill="url(#ag_bg)"/>

    <!-- Header Section -->
    <text x="32" y="38" class="ag-sans" font-size="16" font-weight="700" fill="#f0f9ff">Adarsh's Contribution Activity</text>
    <text x="798" y="38" text-anchor="end" class="ag-mono" font-size="12.5" fill="#34d399" font-weight="700">🌿 612 Commits in 2026</text>

    <!-- Grid Horizontal Reference Lines -->
    <line x1="50" y1="75" x2="790" y2="75" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    <line x1="50" y1="125" x2="790" y2="125" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    <line x1="50" y1="175" x2="790" y2="175" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    <line x1="50" y1="225" x2="790" y2="225" stroke="#1e3a5f" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Left Axis Labels -->
    <text x="40" y="79" text-anchor="end" class="ag-mono" font-size="10" fill="#64748b">40</text>
    <text x="40" y="129" text-anchor="end" class="ag-mono" font-size="10" fill="#64748b">25</text>
    <text x="40" y="179" text-anchor="end" class="ag-mono" font-size="10" fill="#64748b">10</text>
    <text x="40" y="229" text-anchor="end" class="ag-mono" font-size="10" fill="#64748b">0</text>

    <!-- Area Gradient Fill -->
    <path d="M 65,225 
             L 65,190 
             Q 115,160 145,175 
             T 225,140 
             T 305,110 
             T 385,150 
             T 465,120 
             T 545,90 
             T 625,130 
             T 705,70 
             T 775,100 
             L 775,225 Z" fill="url(#ag_area)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.4s" fill="freeze"/>
    </path>

    <!-- Main Activity Curve with Draw-in Animation -->
    <path d="M 65,190 
             Q 115,160 145,175 
             T 225,140 
             T 305,110 
             T 385,150 
             T 465,120 
             T 545,90 
             T 625,130 
             T 705,70 
             T 775,100" 
      fill="none" stroke="url(#ag_line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
      filter="url(#ag_glow)"
      stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="1.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </path>

    <!-- Data Peak Highlight Dots -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
      <circle cx="145" cy="175" r="4.5" fill="#38bdf8"/>
      <circle cx="225" cy="140" r="4.5" fill="#34d399"/>
      <circle cx="305" cy="110" r="5" fill="#7dd3fc"/>
      <circle cx="385" cy="150" r="4.5" fill="#38bdf8"/>
      <circle cx="465" cy="120" r="5" fill="#34d399"/>
      <circle cx="545" cy="90" r="5.5" fill="#38bdf8"/>
      <circle cx="625" cy="130" r="4.5" fill="#7dd3fc"/>
      <circle cx="705" cy="70" r="6" fill="#34d399" filter="url(#ag_glow)">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="775" cy="100" r="5" fill="#38bdf8"/>
    </g>

    <!-- Month Labels (X Axis) -->
    <g class="ag-sans" font-size="11.5" fill="#94a3b8" text-anchor="middle">
      <text x="65" y="252">Jan</text>
      <text x="130" y="252">Feb</text>
      <text x="195" y="252">Mar</text>
      <text x="260" y="252">Apr</text>
      <text x="325" y="252">May</text>
      <text x="390" y="252">Jun</text>
      <text x="455" y="252">Jul</text>
      <text x="520" y="252">Aug</text>
      <text x="585" y="252">Sep</text>
      <text x="650" y="252">Oct</text>
      <text x="715" y="252">Nov</text>
      <text x="775" y="252">Dec</text>
    </g>

    <!-- Subtitle Summary -->
    <text x="415" y="280" text-anchor="middle" class="ag-sans" font-size="11" fill="#64748b">
      💧 Consistent Daily Progress • Me vs Me
    </text>

    <!-- Outer Border -->
    <rect x="1" y="1" width="828" height="298" rx="17" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
</svg>
