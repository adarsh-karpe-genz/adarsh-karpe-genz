<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 186 44" width="186" height="44">
  <defs>
    <!-- Base Pill Clip -->
    <clipPath id="btn_clip">
      <rect x="2" y="2" width="182" height="40" rx="20" ry="20"/>
    </clipPath>

    <!-- Luxury Gold Gradient for Rims -->
    <linearGradient id="gold_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Inner Metallic Gold Stroke -->
    <linearGradient id="inner_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dark Luxury Glass Body Gradient -->
    <linearGradient id="glass_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#070c14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03060a" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Upper Half Glossy Reflection (Classic Luxury Convex Glass) -->
    <linearGradient id="gloss_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Bottom Edge Ambient Rim Highlight -->
    <linearGradient id="bottom_rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="btn_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Light Shimmer Sweep -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Instagram Official Gradient -->
    <linearGradient id="ig_grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="35%" stop-color="#dd2a7b"/>
      <stop offset="70%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
  </defs>

  <style>
    .btn-txt {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.8px;
      fill: #ffffff;
    }
  </style>

  <!-- Base Shadow & Glass Body -->
  <rect x="2" y="2" width="182" height="40" rx="20" fill="url(#glass_body)" filter="url(#btn_shadow)"/>

  <!-- Inside Clipped Content -->
  <g clip-path="url(#btn_clip)">
    <!-- Ambient Accent Glow from Center -->
    <circle cx="93" cy="22" r="60" fill="#dd2a7b" opacity="0.12"/>

    <!-- Upper Half Glossy Reflection (Curved Luxury Convex Glass) -->
    <path d="M 4,2 L 182,2 C 176,18 10,18 4,2 Z" fill="url(#gloss_top)"/>
    <ellipse cx="93" cy="5" rx="79" ry="8" fill="#ffffff" opacity="0.15"/>

    <!-- Bottom Subtle Inner Glow -->
    <path d="M 12,40 Q 93,36 174,40" stroke="url(#bottom_rim)" stroke-width="2" fill="none"/>

    <!-- Icon -->
    <g transform="translate(18, 11) scale(0.72)">
  <rect x="1" y="1" width="24" height="24" rx="6.5" fill="url(#ig_grad)"/>
  <rect x="4.5" y="4.5" width="17" height="17" rx="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="13" cy="13" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="17.8" cy="8.2" r="1.3" fill="#ffffff"/>
</g>

    <!-- Text -->
    <text x="56" y="26.5" class="btn-txt">INSTAGRAM</text>

    <!-- Animated Shimmer Sweep -->
    <rect x="-80" y="0" width="70" height="44" fill="url(#shimmer)" transform="skewX(-25)">
      <animate attributeName="x" values="-100;306" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Golden Metallic Outer Rim (Matching Reference Photo) -->
  <rect x="2" y="2" width="182" height="40" rx="20" fill="none" stroke="url(#gold_rim)" stroke-width="1.6"/>
  <rect x="3" y="3" width="180" height="38" rx="19" fill="none" stroke="url(#inner_gold)" stroke-width="0.8"/>

  <!-- Lens Flare Glints on Corners (Classic 4-point Star Flares as in Image) -->
  <!-- Left Star Flare -->
  <g transform="translate(18, 5)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="8" ry="1.2" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="1.2" ry="8" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff4d0"/>
  </g>

  <!-- Right Star Flare -->
  <g transform="translate(168, 39)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="8" ry="1.2" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="1.2" ry="8" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff4d0"/>
  </g>
</svg>
