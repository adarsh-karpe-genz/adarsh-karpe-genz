<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 220" width="495" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="st_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f33"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="st_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <clipPath id="st_card"><rect width="495" height="220" rx="18"/></clipPath>

    <filter id="st_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .st-s { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Verdana, Arial, sans-serif; }
    .st-m { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
  </style>

  <g clip-path="url(#st_card)">
    <!-- Background -->
    <rect width="495" height="220" fill="url(#st_bg)"/>

    <!-- Header Title & Underline -->
    <text x="24" y="34" class="st-s" font-size="17" font-weight="700" fill="#f0f9ff">Adarsh's GitHub Stats</text>
    <line x1="24" y1="44" x2="190" y2="44" stroke="url(#st_ring)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" from="24" to="190" dur="0.8s" fill="freeze"/>
    </line>

    <!-- Rank Circle on the Right (Properly Cleared & Spaced) -->
    <g transform="translate(420, 126)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#132d47" stroke-width="8"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#st_ring)" stroke-width="8"
        stroke-linecap="round" transform="rotate(-90)" filter="url(#st_glow)"
        stroke-dasharray="276.4" stroke-dashoffset="276.4">
        <animate attributeName="stroke-dashoffset" from="276.4" to="95.0" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </circle>
      <text x="0" y="8" text-anchor="middle" class="st-s" font-size="28" font-weight="800" fill="#f0f9ff" opacity="0">
        B+
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
      </text>
      <text x="0" y="26" text-anchor="middle" class="st-m" font-size="9.5" fill="#7dd3fc" letter-spacing="1.5" opacity="0">
        RANK
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      </text>
    </g>

    <!-- Stat Items (No overlap with Rank Circle) -->
    <!-- Total Stars -->
    <g opacity="0" transform="translate(-20,0)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.50s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.5s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <circle cx="28" cy="68" r="4" fill="#38bdf8"/>
      <text x="40" y="72" class="st-s" font-size="12.5" fill="#bae6fd">Total Stars</text>
      <rect x="180" y="63" width="140" height="7" rx="3.5" fill="#132d47"/>
      <rect x="180" y="63" width="0" height="7" rx="3.5" fill="#38bdf8">
        <animate attributeName="width" from="0" to="58.0" dur="0.9s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="330" y="72" class="st-m" font-size="12" fill="#f0f9ff">24</text>
    </g>

    <!-- Total Commits -->
    <g opacity="0" transform="translate(-20,0)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.65s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.5s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <circle cx="28" cy="95" r="4" fill="#34d399"/>
      <text x="40" y="99" class="st-s" font-size="12.5" fill="#bae6fd">Total Commits</text>
      <rect x="180" y="90" width="140" height="7" rx="3.5" fill="#132d47"/>
      <rect x="180" y="90" width="0" height="7" rx="3.5" fill="#34d399">
        <animate attributeName="width" from="0" to="140.0" dur="0.9s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="330" y="99" class="st-m" font-size="12" fill="#f0f9ff">612</text>
    </g>

    <!-- Pull Requests -->
    <g opacity="0" transform="translate(-20,0)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.80s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.5s" begin="0.80s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <circle cx="28" cy="122" r="4" fill="#7dd3fc"/>
      <text x="40" y="126" class="st-s" font-size="12.5" fill="#bae6fd">Pull Requests</text>
      <rect x="180" y="117" width="140" height="7" rx="3.5" fill="#132d47"/>
      <rect x="180" y="117" width="0" height="7" rx="3.5" fill="#7dd3fc">
        <animate attributeName="width" from="0" to="48.0" dur="0.9s" begin="0.90s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="330" y="126" class="st-m" font-size="12" fill="#f0f9ff">18</text>
    </g>

    <!-- Issues Closed -->
    <g opacity="0" transform="translate(-20,0)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.95s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.5s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <circle cx="28" cy="149" r="4" fill="#38bdf8"/>
      <text x="40" y="153" class="st-s" font-size="12.5" fill="#bae6fd">Issues Closed</text>
      <rect x="180" y="144" width="140" height="7" rx="3.5" fill="#132d47"/>
      <rect x="180" y="144" width="0" height="7" rx="3.5" fill="#38bdf8">
        <animate attributeName="width" from="0" to="32.0" dur="0.9s" begin="1.05s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="330" y="153" class="st-m" font-size="12" fill="#f0f9ff">9</text>
    </g>

    <!-- Repos Contributed To -->
    <g opacity="0" transform="translate(-20,0)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.10s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.5s" begin="1.10s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <circle cx="28" cy="176" r="4" fill="#34d399"/>
      <text x="40" y="180" class="st-s" font-size="12.5" fill="#bae6fd">Contributed To</text>
      <rect x="180" y="171" width="140" height="7" rx="3.5" fill="#132d47"/>
      <rect x="180" y="171" width="0" height="7" rx="3.5" fill="#34d399">
        <animate attributeName="width" from="0" to="22.0" dur="0.9s" begin="1.20s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="330" y="180" class="st-m" font-size="12" fill="#f0f9ff">5</text>
    </g>

    <!-- Border -->
    <rect x="1" y="1" width="493" height="218" rx="17" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
</svg>