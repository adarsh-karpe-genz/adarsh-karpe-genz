<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <clipPath id="st_clip"><rect width="340" height="300" rx="18" ry="18"/></clipPath>
    <!-- Luxury Gold Gradient for Rims -->
    <linearGradient id="gold_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Inner Metallic Specular Gold Stroke -->
    <linearGradient id="inner_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Luxury Midnight Glass Body -->
    <linearGradient id="glass_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1829" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#06101d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03070d" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Upper Half Convex Glass Gloss Highlight -->
    <linearGradient id="glass_gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="gold_shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="card_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Rank Ring Gradient -->
    <linearGradient id="st_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    .st-s { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    .st-m { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Base Glass Body -->
  <rect width="340" height="300" rx="18" fill="url(#glass_body)" filter="url(#card_shadow)"/>

  <g clip-path="url(#st_clip)">
    <!-- Upper Glass Gloss Highlight (Convex Luxury Glass) -->
    <ellipse cx="170" cy="8" rx="155" ry="32" fill="url(#glass_gloss)"/>

    <!-- Header & Subtitle -->
    <text x="22" y="32" class="st-s" font-size="16" font-weight="700" fill="#f0f9ff">GitHub Stats</text>
    <text x="22" y="48" class="st-s" font-size="11" fill="#7dd3fc">Adarsh Karpe &#8226; Activity</text>

    <!-- Rank Ring (Top Right) -->
    <g transform="translate(284, 52)">
      <circle cx="0" cy="0" r="28" fill="#040c17" stroke="#132d47" stroke-width="5.5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#st_ring)" stroke-width="5.5"
        stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="175.9" stroke-dashoffset="175.9">
        <animate attributeName="stroke-dashoffset" from="175.9" to="58.0" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </circle>
      <text x="0" y="5.5" text-anchor="middle" class="st-s" font-size="17" font-weight="800" fill="#fef08a" opacity="0">
        B+
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      </text>
      <text x="0" y="16" text-anchor="middle" class="st-m" font-size="7" letter-spacing="1" fill="#7dd3fc" opacity="0">
        RANK
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      </text>
    </g>

    <!-- Top Divider -->
    <line x1="22" y1="92" x2="318" y2="92" stroke="#1e3a5f" stroke-width="1.2" opacity="0.6"/>

    <!-- Stat 1: Total Stars -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.50s" fill="freeze"/>
      <circle cx="28" cy="116" r="4.5" fill="#38bdf8"/>
      <text x="42" y="120" class="st-s" font-size="12.5" fill="#bae6fd">Total Stars</text>
      <rect x="148" y="112" width="128" height="6" rx="3" fill="#0c2138"/>
      <rect x="148" y="112" width="0" height="6" rx="3" fill="#38bdf8">
        <animate attributeName="width" from="0" to="88" dur="0.8s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="318" y="120" text-anchor="end" class="st-m" font-size="12" fill="#f0f9ff">24</text>
    </g>

    <!-- Stat 2: Total Commits -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.65s" fill="freeze"/>
      <circle cx="28" cy="151" r="4.5" fill="#34d399"/>
      <text x="42" y="155" class="st-s" font-size="12.5" fill="#bae6fd">Total Commits</text>
      <rect x="148" y="147" width="128" height="6" rx="3" fill="#0c2138"/>
      <rect x="148" y="147" width="0" height="6" rx="3" fill="#34d399">
        <animate attributeName="width" from="0" to="122" dur="0.8s" begin="0.70s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="318" y="155" text-anchor="end" class="st-m" font-size="12" fill="#f0f9ff">612</text>
    </g>

    <!-- Stat 3: Pull Requests -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.80s" fill="freeze"/>
      <circle cx="28" cy="186" r="4.5" fill="#0ea5e9"/>
      <text x="42" y="190" class="st-s" font-size="12.5" fill="#bae6fd">Pull Requests</text>
      <rect x="148" y="182" width="128" height="6" rx="3" fill="#0c2138"/>
      <rect x="148" y="182" width="0" height="6" rx="3" fill="#0ea5e9">
        <animate attributeName="width" from="0" to="72" dur="0.8s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="318" y="190" text-anchor="end" class="st-m" font-size="12" fill="#f0f9ff">18</text>
    </g>

    <!-- Stat 4: Issues Closed -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.95s" fill="freeze"/>
      <circle cx="28" cy="221" r="4.5" fill="#f59e0b"/>
      <text x="42" y="225" class="st-s" font-size="12.5" fill="#bae6fd">Issues Closed</text>
      <rect x="148" y="217" width="128" height="6" rx="3" fill="#0c2138"/>
      <rect x="148" y="217" width="0" height="6" rx="3" fill="#f59e0b">
        <animate attributeName="width" from="0" to="46" dur="0.8s" begin="1.00s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="318" y="225" text-anchor="end" class="st-m" font-size="12" fill="#f0f9ff">9</text>
    </g>

    <!-- Stat 5: Contributed To -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.10s" fill="freeze"/>
      <circle cx="28" cy="256" r="4.5" fill="#2dd4bf"/>
      <text x="42" y="260" class="st-s" font-size="12.5" fill="#bae6fd">Contributed To</text>
      <rect x="148" y="252" width="128" height="6" rx="3" fill="#0c2138"/>
      <rect x="148" y="252" width="0" height="6" rx="3" fill="#2dd4bf">
        <animate attributeName="width" from="0" to="34" dur="0.8s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="318" y="260" text-anchor="end" class="st-m" font-size="12" fill="#f0f9ff">5</text>
    </g>

    <!-- Animated Light Shimmer Sweep -->
    <rect x="-100" y="0" width="80" height="300" fill="url(#gold_shimmer)" transform="skewX(-22)">
      <animate attributeName="x" values="-120;460" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Metallic Gold Rim (Matching Luxury Buttons) -->
  <rect x="1.5" y="1.5" width="337" height="297" rx="16.5" fill="none" stroke="url(#gold_rim)" stroke-width="1.8"/>
  <rect x="3" y="3" width="334" height="294" rx="15" fill="none" stroke="url(#inner_gold)" stroke-width="0.8"/>

  <!-- Star Lens Flare Glints on Corners -->
  <g transform="translate(18, 10)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="9" ry="1.2" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="1.2" ry="9" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff4d0"/>
  </g>
  <g transform="translate(322, 290)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="9" ry="1.2" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="1.2" ry="9" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff4d0"/>
  </g>
</svg>
