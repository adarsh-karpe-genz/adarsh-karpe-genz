<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Type Garden — Adarsh Karpe Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #040f1a;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'DM Mono', ui-monospace, monospace;
      color: #fff;
    }
    a { color: #fff; }
    a:hover { color: #FFB4A8; }
    input[type=range] { accent-color: #ffd700; }

    [data-tg="app"] {
      position: fixed;
      inset: 0;
      cursor: text;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-tg="app"] button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html[data-touch] [data-tg="app"] {
      touch-action: none;
      top: var(--tg-top, 0px) !important;
      bottom: auto !important;
      height: var(--tg-h, 100%) !important;
    }

    /* Top Controls Header */
    [data-tg="topbar"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(20px + env(safe-area-inset-left));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    [data-tg="topbar"] > * {
      pointer-events: auto;
    }

    .pill-capsule {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px;
      border: 1px solid rgba(255, 215, 0, 0.28);
      border-radius: 999px;
      background: rgba(4, 15, 26, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 12px rgba(255,215,0,0.05);
    }

    .capsule-btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #94a3b8;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .capsule-btn:hover {
      color: #fff4d0;
    }
    .capsule-btn.active {
      background: linear-gradient(135deg, #fff4d0, #ffd700);
      color: #040f1a;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(255,215,0,0.3);
    }

    /* Bottom Status & Hint Bar */
    [data-tg="bar"] {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left));
      right: calc(24px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }
    [data-tg="bar"]:hover {
      opacity: 1;
    }
    [data-tg="coarse"] { display: none; }
    @media (pointer: coarse) {
      [data-tg="fine"] { display: none; }
      [data-tg="coarse"] { display: inline; }
    }
    @media (max-width: 820px) {
      [data-tg="topbar"] {
        flex-wrap: wrap;
        gap: 8px;
      }
      [data-tg="bar"] {
        left: calc(14px + env(safe-area-inset-left));
        right: calc(14px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
        gap: 10px;
      }
      [data-tg="hints"] { gap: 10px !important; font-size: 11px; }
      [data-tg="ctrls"] { flex: 1 1 100%; justify-content: space-between; gap: 8px !important; }
      [data-tg="pal"] { gap: 4px !important; }
      [data-tg="sw"] { --sw: clamp(14px, calc((100vw - 190px) / 12), 22px); width: var(--sw) !important; height: var(--sw) !important; }
      [data-tg="dot"] { width: calc(var(--sw) * .46) !important; height: calc(var(--sw) * .46) !important; }
      [data-tg="btn"] { padding: 6px 11px !important; font-size: 11px !important; }
    }

    [data-tg="poster"] {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
      background: #02070e;
      cursor: default;
      color: #EDEDED;
      font-size: 12px;
      letter-spacing: 0.03em;
      z-index: 8;
    }
    [data-tg="panel"] {
      border-right: 1px solid rgba(255, 215, 0, 0.15);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 22px 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: #040e1b;
    }
    [data-tg="panel"]::-webkit-scrollbar { width: 6px; }
    [data-tg="panel"]::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }

    @media (max-width: 820px) {
      [data-tg="poster"] {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      [data-tg="poster"]::before {
        content: "";
        order: -2;
        position: sticky;
        top: 0;
        flex: none;
        height: calc(60px + env(safe-area-inset-top));
        margin-bottom: calc(-60px - env(safe-area-inset-top));
        background: linear-gradient(#040e1b 62%, rgba(0,0,0,0));
        z-index: 4;
        pointer-events: none;
      }
      [data-tg="stage"] {
        order: -1;
        flex: none;
        padding: calc(64px + env(safe-area-inset-top)) 16px 12px !important;
      }
      [data-tg="pcanvas"] {
        width: 100% !important;
        max-width: 520px;
      }
      [data-tg="panel"] {
        flex: none;
        border-right: 0 !important;
        border-top: 1px solid rgba(255, 215, 0, 0.2);
        overflow: visible !important;
        padding: 20px 16px calc(36px + env(safe-area-inset-bottom)) !important;
      }
    }

    [data-tg="count"]:empty { display: none; }
    [data-tg="count"]::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd700;
      margin-right: 8px;
      vertical-align: 1px;
      animation: tg-live 2.4s ease-in-out infinite;
    }
    @keyframes tg-live { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(0.8); } }

    .tg-peer {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      transition: opacity .45s;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .04em;
      line-height: 1;
      pointer-events: none;
    }
    .tg-peer svg { display: block; overflow: visible; }
    .tg-peer span {
      position: absolute;
      left: 14px;
      top: 18px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #000;
      white-space: nowrap;
      font-weight: 500;
    }

    .preset-btn {
      text-align: left;
      background: rgba(14, 27, 44, 0.6);
      border: 1px solid #1e3a5f;
      color: #FFFFFF;
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.2s ease;
    }
    .preset-btn:hover { border-color: #ffd700; }
    .preset-btn.active {
      background: #092038;
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255,215,0,0.2);
    }

    .palette-btn {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      background: rgba(14, 27, 44, 0.6);
      border: 1px solid #1e3a5f;
      color: #EDEDED;
      font: inherit;
      padding: 6px 6px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .palette-btn:hover { border-color: #ffd700; }
    .palette-btn.active {
      border-color: #ffd700;
      box-shadow: 0 0 12px rgba(255,215,0,0.25);
    }

    .action-btn {
      background: rgba(8, 24, 43, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff4d0;
      font: inherit;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.15);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    .luxury-select {
      background: #040e1b;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      color: #fff4d0;
      font: inherit;
      font-size: 12px;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .luxury-select:focus, .luxury-select:hover {
      border-color: #ffd700;
    }
  </style>
</head>
<body>
  <div data-tg="app" id="app">
    <!-- Main Interactive Canvas -->
    <canvas id="typeCanvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>

    <!-- Peers Overlay for Live Gardeners -->
    <div data-tg="peers" id="peersLayer" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4;"></div>

    <!-- Hidden Input for Keystroke & Mobile IME Capture -->
    <input id="hiddenInput" data-tg="input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none">

    <!-- Top Bar Controls -->
    <div data-tg="topbar">
      <!-- Left: Flower Variety Selector -->
      <div class="pill-capsule" id="flowerCapsule">
        <span style="font-size:11px;color:#fef08a;padding:0 6px 0 8px;font-weight:700">FLOWER</span>
        <button class="capsule-btn active" data-flower="mix">All Mix</button>
        <button class="capsule-btn" data-flower="lotus">Lotus</button>
        <button class="capsule-btn" data-flower="star">Celestial Star</button>
        <button class="capsule-btn" data-flower="sakura">Sakura</button>
        <button class="capsule-btn" data-flower="sunflower">Sunflower</button>
        <button class="capsule-btn" data-flower="rose">Rose</button>
      </div>

      <!-- Center: Typeface Selector -->
      <div class="pill-capsule" id="fontCapsule">
        <span style="font-size:11px;color:#fef08a;padding:0 6px 0 8px;font-weight:700">FONT</span>
        <button class="capsule-btn active" data-font="playfair">Playfair</button>
        <button class="capsule-btn" data-font="cinzel">Cinzel</button>
        <button class="capsule-btn" data-font="cormorant">Cormorant</button>
        <button class="capsule-btn" data-font="syne">Syne</button>
      </div>

      <!-- Right: Mode Switcher -->
      <div class="pill-capsule">
        <button class="capsule-btn active" id="btnModeType">Type</button>
        <button class="capsule-btn" id="btnModePoster">Poster</button>
      </div>
    </div>

    <!-- Bottom Action & Hint Bar for Type Mode -->
    <div data-tg="bar" id="typeBar">
      <div data-tg="hints" style="display:flex;gap:18px;flex-wrap:wrap">
        <span data-tg="fine">type to grow</span>
        <span data-tg="coarse">tap to type</span>
        <span>space cuts</span>
        <span data-tg="fine">backspace withers</span>
        <span data-tg="coarse">⌫ withers</span>
        <span data-tg="fine">enter clears</span>
        <span data-tg="coarse">return clears</span>
        <span data-tg="count" id="gardenerCount"></span>
      </div>
      <div data-tg="ctrls" style="display:flex;gap:8px;align-items:center">
        <!-- Palette Swatches for Type View -->
        <div data-tg="pal" id="typePalettes" style="display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid rgba(255,215,0,0.3);border-radius:999px;background:rgba(4,15,26,0.85);backdrop-filter:blur(10px)"></div>
        <button class="action-btn" data-tg="btn" id="btnSavePNG">PNG</button>
        <button class="action-btn" data-tg="btn" id="btnSaveSVG">SVG</button>
      </div>
    </div>

    <!-- Poster Mode Container -->
    <div data-tg="poster" id="posterContainer" style="display:none;">
      <div data-tg="panel">
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:26px;letter-spacing:0;color:#FFFFFF">Poster Studio</div>
          <div style="color:#7dd3fc" id="posterInfoLabel">1:1 · 5s loop · 30 fps</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Words</div>
          <input id="posterTextInput" value="ADARSH KARPE" spellcheck="false" style="background:#020813;border:1px solid #1e3a5f;border-radius:10px;color:#FFFFFF;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;padding:10px 12px;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='#ffd700'" onblur="this.style.borderColor='#1e3a5f'">
          <button id="btnReshuffle" style="align-self:flex-start;background:transparent;border:1px solid rgba(255,215,0,0.4);color:#fff4d0;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;transition:all 0.2s;" onmouseenter="this.style.borderColor='#ffd700';this.style.background='rgba(255,215,0,0.1)'" onmouseleave="this.style.borderColor='rgba(255,215,0,0.4)';this.style.background='transparent'">Regrow garden</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Flower Variety</div>
          <select id="posterFlowerSelect" class="luxury-select">
            <option value="mix">All Botanical Mix (Lotus, Star, Sakura, Sunflower, Rose)</option>
            <option value="lotus">Golden Lotus</option>
            <option value="star">Celestial Star Blossom</option>
            <option value="sakura">Sakura (Cherry Blossom)</option>
            <option value="sunflower">Radiant Sunflower</option>
            <option value="rose">Wild Rose (Classic)</option>
          </select>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Typeface</div>
          <select id="posterFontSelect" class="luxury-select">
            <option value="playfair">Playfair Display (Bold Editorial Serif)</option>
            <option value="cinzel">Cinzel Decorative (Luxury Royal Serif)</option>
            <option value="cormorant">Cormorant Garamond (High-Contrast Classical)</option>
            <option value="syne">Syne (Bold Modern Sculptural Display)</option>
          </select>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Motion & Animation</div>
          <div id="posterPresetsGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Color Palette</div>
          <div id="posterPalettesGrid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(255,215,0,0.2);padding-top:20px">
          <div style="color:#7dd3fc;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;font-weight:700">Export · 1080 × 1080 loop</div>
          <button id="btnExportVideo" style="background:linear-gradient(135deg, #fff4d0, #ffd700);border:0;color:#040f1a;font:inherit;font-weight:700;padding:12px 14px;border-radius:999px;cursor:pointer;transition:transform 0.15s, box-shadow 0.2s;box-shadow:0 4px 15px rgba(255,215,0,0.3);">Export MP4 / WebM loop</button>
          <button id="btnExportFrames" style="background:transparent;border:1px solid #1e3a5f;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer;transition:all 0.2s;" onmouseenter="this.style.borderColor='#ffd700'" onmouseleave="this.style.borderColor='#1e3a5f'">PNG frames (.zip)</button>
          <div id="exportStatus" style="color:#7dd3fc;min-height:16px;font-size:11px"></div>
        </div>
      </div>

      <div data-tg="stage" style="display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0">
        <canvas id="posterCanvas" width="1080" height="1080" style="width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1 / 1;display:block;border:1.5px solid rgba(255,215,0,0.4);border-radius:12px;box-shadow: 0 16px 50px rgba(0,0,0,0.8), 0 0 30px rgba(56,189,248,0.15);"></canvas>
      </div>
    </div>
  </div>

  <script>
    /**
     * Type Garden — Custom Adarsh Karpe Edition
     * Multi-Flower Engine (Lotus, Star Blossom, Sakura, Sunflower, Rose)
     * Cosmic Gold & Royal Blue Palette + Stardust Particle Field
     * Multi-Typeface (Playfair, Cinzel Decorative, Cormorant, Syne)
     */
    class TypeGarden {
      constructor() {
        this.FLOWERS_NAMES = ['lotus', 'star', 'sakura', 'sunflower', 'rose', 'fern', 'poppy', 'violet', 'clover', 'daisy', 'lilac', 'aster', 'peony'];
        this.TINTS = ['#ffd700', '#38bdf8', '#34d399', '#ff8a00', '#e63cff', '#ffb7c5', '#7fd18b', '#ffffff'];
        this.SENT = String.fromCharCode(0x200b);

        this.FONTS = [
          { id: 'playfair', name: 'Playfair Display', font: '"Playfair Display", Georgia, serif' },
          { id: 'cinzel', name: 'Cinzel Decorative', font: '"Cinzel Decorative", Georgia, serif' },
          { id: 'cormorant', name: 'Cormorant Garamond', font: '"Cormorant Garamond", Georgia, serif' },
          { id: 'syne', name: 'Syne', font: '"Syne", sans-serif' }
        ];

        this.props = { boil: true, recoil: 20, density: 1.0, showHint: true };

        this.PRESETS = [
          { id: 'cosmic', label: 'Cosmic Flow', sub: 'Wave river & stardust · 5s', T: 5000 },
          { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
          { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
          { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 },
          { id: 'wind', label: 'Gust', sub: 'Wind sweeps through · 4s', T: 4000 },
          { id: 'reach', label: 'Reach', sub: 'Stems follow a light · 6s', T: 6000 },
          { id: 'scatter', label: 'Scatter', sub: 'Random bloom, fade · 6s', T: 6000 },
          { id: 'visit', label: 'Visitor', sub: 'Butterfly drops by · 7s', T: 7000 }
        ];

        // Custom Palettes — featuring Cosmic Gold & Royal Blue matching header banner!
        this.PAL = [
          ['Cosmic Gold', '#040f1a', '#FFD700', '#0284C7', '#FFF4D0', '#FFFFFF'],
          ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
          ['Emerald Forest', '#041812', '#10B981', '#34D399', '#A7F3D0', '#F0FDF4'],
          ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
          ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
          ['Citrus Gold', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
          ['Orchid Dream', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
          ['Moss Velvet', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
          ['Ruby Velvet', '#1A0408', '#FF1440', '#7E1D36', '#FFD2DC', '#FFFFFF'],
          ['Solar Flare', '#1E0D00', '#FFAA00', '#D97706', '#FFF0B8', '#FFFBEB'],
          ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
          ['Mono Lux', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
        ];

        this.state = {
          mode: 'type',
          preset: 'cosmic',
          palette: 0, // Cosmic Gold is default
          flowerType: 'mix', // 'mix', 'lotus', 'star', 'sakura', 'sunflower', 'rose'
          fontId: 'playfair',
          text: 'ADARSH KARPE',
          seed: 7,
          status: '',
          busy: false
        };

        // DOM elements
        this.appEl = document.getElementById('app');
        this.cv = document.getElementById('typeCanvas');
        this.g = this.cv.getContext('2d');
        this.pcv = document.getElementById('posterCanvas');
        this.inp = document.getElementById('hiddenInput');
        this.peersLayer = document.getElementById('peersLayer');
        this.btnModeType = document.getElementById('btnModeType');
        this.btnModePoster = document.getElementById('btnModePoster');
        this.typeBar = document.getElementById('typeBar');
        this.posterContainer = document.getElementById('posterContainer');
        this.typePalettes = document.getElementById('typePalettes');
        this.posterPresetsGrid = document.getElementById('posterPresetsGrid');
        this.posterPalettesGrid = document.getElementById('posterPalettesGrid');
        this.posterTextInput = document.getElementById('posterTextInput');
        this.posterInfoLabel = document.getElementById('posterInfoLabel');
        this.posterFlowerSelect = document.getElementById('posterFlowerSelect');
        this.posterFontSelect = document.getElementById('posterFontSelect');

        l.endEls = null;
        const T = [], tr = this.rng(l.id * 977 + Math.floor(this.rand() * 1e6));
        this.grow(tr, T, () => l.id * 100 + 90 + T.length, p, { base: [w * 0.25, -0.1 - tr() * 0.45], dir: (tr() - 0.5) * 1.4, len: 0.45 + tr() * 0.25, d0: 0, tip: 'curl', depth: 1 });
        l.tend = T.filter(e => e.t === 'stem').slice(0, 1);
      }
      genEnd(l, rel) {
        const r = this.rng(l.ws + l.wi * 31 + Math.floor(this.rand() * 1e6)), p = this.wordParams(l.ws), E = [];
        let k0 = 50; const nid = () => l.id * 100 + (k0++);
        const w = this.mw(l.ch), n = 1 + Math.floor(r() * 2.5); p.w = w;
        for (let i = 0; i < n; i++) {
          const dir = -Math.PI / 2 + 0.6 + (i - (n - 1) / 2) * 0.9 + (r() - 0.5) * 0.4;
          this.grow(r, E, nid, p, { base: [(r() - 0.2) * w * 0.6, -r() * 0.5], dir, len: 0.4 + r() * 0.45, d0: rel + 40 + i * 90, depth: 1, tip: i === 0 || r() < 0.5 ? 'flower' : 'fan' });
        }
        l.endEls = E;
      }

      strokeRange(B, P, a, b, col, w) {
        const n = P.length - 1, ia = a * n, ib = b * n;
        const lerp = t => { const i = Math.min(n - 1, Math.floor(t)), f = t - i; return [P[i][0] + (P[i+1][0] - P[i][0]) * f, P[i][1] + (P[i+1][1] - P[i][1]) * f]; };
        const pts = [lerp(ia)];
        for (let i = Math.floor(ia) + 1; i < ib; i++) pts.push(P[i]);
        pts.push(lerp(ib));
        if (pts.length >= 2) B.stroke(pts, col, w);
      }
      thorn(B, P, u, s, S) {
        const [p, a] = this.at(P, u), d = a + s * 2.3, L = S * 0.045;
        B.stroke([p, [p[0] + Math.cos(d) * L, p[1] + Math.sin(d) * L]], this.cc.blue, S * 0.022);
      }
      leaf(B, bx, by, a, L, bend) {
        if (L < 0.5) return;
        const ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
        const ax = u => { const b = Math.sin(Math.PI * u) * bend * 0.15 * L; return [bx + ca * u * L + px * b, by + sa * u * L + py * b]; };
        const hw = u => L * 0.18 * Math.sin(Math.PI * Math.pow(u, 0.8));
        const N = 12, s1 = [], s2 = [];
        for (let i = 0; i <= N; i++) { const u = i / N, c = ax(u), w = hw(u); s1.push([c[0] + px * w, c[1] + py * w]); s2.push([c[0] - px * w, c[1] - py * w]); }
        const tip = ax(1), base = ax(0);
        B.fill([base, ...s1.slice(1, N), tip, tip, ...s2.slice(1, N).reverse(), base], this.cc.blue);
        if (L > 6) { const v = []; for (let i = 0; i <= 8; i++) v.push(ax(0.08 + 0.72 * i / 8)); B.stroke(v, this.cc.vein, Math.max(0.8, L * 0.03)); }
      }

      // ---------- MULTI-FLOWER DRAWING DISPATCHER ----------
      drawFlower(B, cx, cy, R, rot, e, a, tl, ftype) {
        const type = ftype || e.ftype || this.state.flowerType;
        if (type === 'lotus') {
          this.lotus(B, cx, cy, R, rot, e, a, tl);
        } else if (type === 'star') {
          this.starBlossom(B, cx, cy, R, rot, e, a, tl);
        } else if (type === 'sakura') {
          this.sakura(B, cx, cy, R, rot, e, a, tl);
        } else if (type === 'sunflower') {
          this.sunflower(B, cx, cy, R, rot, e, a, tl);
        } else {
          this.rose(B, cx, cy, R, rot, e, a, tl);
        }

        // Add 4-Point Sparkling Star Flare Glint on flower center when bloomed!
        if (R > 6 && a > 400) {
          this.drawStarFlare(B, cx, cy, R * 0.55, a);
        }
      }

      drawStarFlare(B, cx, cy, r, a) {
        const pulse = 0.5 + 0.5 * Math.sin(a * 0.005);
        const rad = r * pulse;
        const ptsH = [
          [cx - rad, cy], [cx - rad * 0.15, cy - rad * 0.15],
          [cx, cy - rad * 0.8], [cx + rad * 0.15, cy - rad * 0.15],
          [cx + rad, cy], [cx + rad * 0.15, cy + rad * 0.15],
          [cx, cy + rad * 0.8], [cx - rad * 0.15, cy + rad * 0.15]
        ];
        B.fill(ptsH, '#FFFFFF');
      }

      // 1. Classic Rose
      rose(B, cx, cy, R, rot, e, a, tl) {
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const tm = tl ? Math.hypot(tl[0], tl[1]) : 0, ux = tm ? tl[0] / tm : 0, uy = tm ? tl[1] / tm : 0, sq = -0.28 * tm;
        const T = (x, y, z = 0) => {
          let dx = x * cr - y * sr, dy = x * sr + y * cr;
          if (tm) { const k = (dx * ux + dy * uy) * sq; dx += k * ux + tl[0] * R * z; dy += k * uy + tl[1] * R * z; }
          return [cx + dx, cy + dy];
        };
        const P = [
          [0, -0.36, 0.56, 0.54, 0, 0, 0],
          [-0.5, -0.06, 0.6, 0.6, -0.35, 0, 0],
          [0.52, -0.06, 0.6, 0.6, 0.35, 0, 0],
          [-0.42, 0.3, 0.62, 0.48, 0.2, 0.12, 1],
          [0.47, 0.3, 0.62, 0.48, -0.2, 0.12, 1],
          [0.05, 0.42, 0.56, 0.38, 0, 0.14, 0]
        ];
        const ax0 = 0, ay0 = 0.5, lw = Math.max(0.8, R * 0.045), st = 85;
        P.forEach((q, i) => {
          const s = this.spr((a - i * st) / 1000, 8, 14); if (s <= 0.001) return;
          const open = (1 - Math.min(1, s)) * (q[0] < 0 ? 0.5 : -0.5), ang = q[4] + open, ca = Math.cos(ang), sa = Math.sin(ang);
          const pt = (th) => {
            const rr = 1 + 0.08 * Math.sin(3 * th + e.ph1 + i) + 0.04 * Math.sin(5 * th + e.ph2);
            const lx = Math.cos(th) * q[2] * rr, ly = Math.sin(th) * q[3] * rr;
            const px = q[0] + lx * ca - ly * sa, py = q[1] + lx * sa + ly * ca;
            return T((ax0 + (px - ax0) * s) * R, (ay0 + (py - ay0) * s) * R, q[5]);
          };
          const pts = []; for (let k = 0; k < 26; k++) pts.push(pt(k / 26 * Math.PI * 2));
          B.fill(pts, this.cc.red);
          if (q[6] && R >= 12 && s > 0.4) {
            const arc = []; for (let k = 0; k <= 14; k++) arc.push(pt(Math.PI * (1.18 + 0.64 * k / 14)));
            this.strokeRange(B, arc, 0, Math.min(1, (s - 0.4) / 0.5), this.cc.line, lw * 0.8);
          }
        });
        const fr = this.eo((a - P.length * st - 80) / 520);
        if (fr > 0 && R > 3) {
          const sp = [], scl = [];
          const turns = R < 20 ? Math.min(e.turns, 1.3) : R < 32 ? e.turns * 0.8 : e.turns;
          for (let i = 0; i <= 70; i++) { const u = i / 70, th = e.ph1 + u * turns * Math.PI * 2, rr = R * (0.08 + 0.57 * u); sp.push(T(Math.cos(th) * rr * 1.05, Math.sin(th) * rr * 0.72 - 0.12 * R, 0.34 - 0.24 * u)); }
          this.strokeRange(B, sp, 0, fr, this.cc.line, lw);
          if (R >= 14) {
            for (let i = 0; i <= 36; i++) { const u = i / 36; scl.push(T((-0.72 + 1.5 * u) * R, 0.36 * R + 0.16 * R * Math.abs(Math.sin(u * Math.PI * 3)), 0.18)); }
            this.strokeRange(B, scl, 0, fr, this.cc.line, lw);
          }
        }
      }

      // 2. Golden Lotus
      lotus(B, cx, cy, R, rot, e, a, tl) {
        const s = this.spr(a / 1000, 7, 12);
        if (s <= 0.001) return;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const T = (x, y) => [cx + (x * cr - y * sr), cy + (x * sr + y * cr)];
        const numPetals = 8;
        // Outer petals
        for (let i = 0; i < numPetals; i++) {
          const ang = (i / numPetals) * Math.PI * 2 + e.ph1 * 0.2;
          const pR = R * s * 1.1;
          const px = Math.cos(ang), py = Math.sin(ang);
          const pts = [
            T(0, 0),
            T((px * 0.6 - py * 0.3) * pR, (py * 0.6 + px * 0.3) * pR),
            T(px * pR, py * pR),
            T((px * 0.6 + py * 0.3) * pR, (py * 0.6 - px * 0.3) * pR)
          ];
          B.fill(pts, this.cc.red);
          B.stroke(pts, this.cc.line, Math.max(0.8, R * 0.035));
        }
        // Inner luminous lotus petals
        const innerPetals = 6;
        for (let i = 0; i < innerPetals; i++) {
          const ang = (i / innerPetals) * Math.PI * 2 + Math.PI / innerPetals + e.ph1 * 0.2;
          const pR = R * s * 0.7;
          const px = Math.cos(ang), py = Math.sin(ang);
          const pts = [
            T(0, 0),
            T((px * 0.5 - py * 0.22) * pR, (py * 0.5 + px * 0.22) * pR),
            T(px * pR, py * pR),
            T((px * 0.5 + py * 0.22) * pR, (py * 0.5 - px * 0.22) * pR)
          ];
          B.fill(pts, this.cc.line);
        }
        // Center seed pod
        const pod = [];
        for (let i = 0; i < 16; i++) {
          const th = (i / 16) * Math.PI * 2;
          pod.push(T(Math.cos(th) * R * 0.22 * s, Math.sin(th) * R * 0.22 * s));
        }
        B.fill(pod, '#ffd700');
      }

      // 3. Celestial Star Blossom
      starBlossom(B, cx, cy, R, rot, e, a, tl) {
        const s = this.spr(a / 1000, 8, 14);
        if (s <= 0.001) return;
        const cr = Math.cos(rot + a * 0.0003), sr = Math.sin(rot + a * 0.0003);
        const T = (x, y) => [cx + (x * cr - y * sr), cy + (x * sr + y * cr)];
        const rays = 8;
        const pts = [];
        for (let i = 0; i < rays * 2; i++) {
          const th = (i / (rays * 2)) * Math.PI * 2;
          const rad = (i % 2 === 0 ? R * 1.25 : R * 0.38) * s;
          pts.push(T(Math.cos(th) * rad, Math.sin(th) * rad));
        }
        B.fill(pts, this.cc.red);
        B.stroke(pts, this.cc.line, Math.max(1, R * 0.04));

        // Inner 4-point radiant diamond
        const inPts = [];
        for (let i = 0; i < 8; i++) {
          const th = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const rad = (i % 2 === 0 ? R * 0.55 : R * 0.2) * s;
          inPts.push(T(Math.cos(th) * rad, Math.sin(th) * rad));
        }
        B.fill(inPts, this.cc.line);
      }

      // 4. Sakura (Cherry Blossom)
      sakura(B, cx, cy, R, rot, e, a, tl) {
        const s = this.spr(a / 1000, 7, 13);
        if (s <= 0.001) return;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const T = (x, y) => [cx + (x * cr - y * sr), cy + (x * sr + y * cr)];
        const petals = 5;
        for (let i = 0; i < petals; i++) {
          const baseAng = (i / petals) * Math.PI * 2;
          const pR = R * s * 1.15;
          const w = pR * 0.42;
          const ca = Math.cos(baseAng), sa = Math.sin(baseAng);
          const nx = -sa, ny = ca;
          const p1 = T(0, 0);
          const p2 = T(ca * pR * 0.6 + nx * w, sa * pR * 0.6 + ny * w);
          const tipLeft = T(ca * pR + nx * w * 0.8, sa * pR + ny * w * 0.8);
          const notch = T(ca * pR * 0.88, sa * pR * 0.88);
          const tipRight = T(ca * pR - nx * w * 0.8, sa * pR - ny * w * 0.8);
          const p4 = T(ca * pR * 0.6 - nx * w, sa * pR * 0.6 - ny * w);
          const pts = [p1, p2, tipLeft, notch, tipRight, p4];
          B.fill(pts, this.cc.red);
          B.stroke([p1, notch], this.cc.line, Math.max(0.7, R * 0.025));
        }
        // Center pistil dots
        for (let i = 0; i < 8; i++) {
          const th = (i / 8) * Math.PI * 2;
          const p = T(Math.cos(th) * R * 0.28 * s, Math.sin(th) * R * 0.28 * s);
          B.stroke([T(0, 0), p], this.cc.line, 0.8);
          const dot = [];
          for (let k = 0; k < 8; k++) {
            const da = (k / 8) * Math.PI * 2;
            dot.push([p[0] + Math.cos(da) * 1.8, p[1] + Math.sin(da) * 1.8]);
          }
          B.fill(dot, '#ffffff');
        }
      }

      // 5. Radiant Sunflower
      sunflower(B, cx, cy, R, rot, e, a, tl) {
        const s = this.spr(a / 1000, 7, 14);
        if (s <= 0.001) return;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const T = (x, y) => [cx + (x * cr - y * sr), cy + (x * sr + y * cr)];
        const count = 14;
        for (let i = 0; i < count; i++) {
          const th = (i / count) * Math.PI * 2;
          const pR = R * s * 1.25;
          const ca = Math.cos(th), sa = Math.sin(th);
          const nx = -sa, ny = ca;
          const pts = [
            T(ca * R * 0.35, sa * R * 0.35),
            T(ca * pR * 0.65 + nx * R * 0.16, sa * pR * 0.65 + ny * R * 0.16),
            T(ca * pR, sa * pR),
            T(ca * pR * 0.65 - nx * R * 0.16, sa * pR * 0.65 - ny * R * 0.16)
          ];
          B.fill(pts, '#ffd700');
        }
        // Dark golden core disk
        const core = [];
        for (let i = 0; i < 20; i++) {
          const th = (i / 20) * Math.PI * 2;
          core.push(T(Math.cos(th) * R * 0.42 * s, Math.sin(th) * R * 0.42 * s));
        }
        B.fill(core, '#0a192f');
        B.stroke(core, '#fff4d0', 1.2);
      }

      // ---------- Main Frame Render Loop ----------
      frame() {
        const now = performance.now(), dt = Math.min(64, now - (this.lt || now)); this.lt = now;
        if (this.state.mode === 'poster') {
          if (this.pcv && !this.state.busy) {
            this.posterDraw(this.pcv.getContext('2d'), now - (this.pt0 || 0));
          }
          return;
        }
        const k = 1 - Math.exp(-dt / 80);
        this.Sd += (this.St - this.Sd) * k;
        this.cx += (this.ctx_ - this.cx) * k; this.cy += (this.cty - this.cy) * k;
        for (const l of this.letters) if (!l.dead && l.tx != null) { l.x += (l.tx - l.x) * k; l.y += (l.ty - l.y) * k; }
        this.letters = this.letters.filter(l => !(l.dead && now - l.dead > 300));
        this.liveStep(now, dt);
        this.paint(now, true);
      }

      paint(now, caret) {
        const g = this.g, d = this.dpr;
        g.setTransform(d, 0, 0, d, 0, 0);
        g.fillStyle = this.pal().bg;
        g.fillRect(0, 0, this.W, this.H);

        // Draw Ambient Twinkling Stardust Field
        this.drawStardust(g, now);

        const B = this.backend(g), st = this.mainState();
        this.render(B, now, st);
        this.drawFlies(B, now, st.C);

        if (caret && this.gifts && this.gifts.length) {
          const LIFE = 60000; this.gifts = this.gifts.filter(gf => now - gf.t0 < LIFE);
          for (const gf of this.gifts) {
            const age = now - gf.t0, w = 1 - this.eo((age - (LIFE - 2200)) / 2200);
            g.globalAlpha = Math.max(0, w);
            this.drawFlower(B, gf.x * this.W, gf.y * this.H + (1 - w) * this.Sd * 0.3, this.Sd * 0.24 * (0.65 + 0.35 * w), gf.rot + (1 - w) * 0.6, gf.e, age, null, gf.ftype);
          }
          g.globalAlpha = 1;
        }

        if (caret) {
          const S = this.Sd, on = now - this.lastKey < 500 || Math.floor(now / 530) % 2 === 0, hf = this.eo((now - this.t0) / 600);
          if (on && hf > 0) { const h = 0.8 * S * hf, w = Math.max(2, S * 0.03); B.rect(this.cx - w / 2, this.cy - h / 2, w, h, st.C.text); }
        }
      }

      drawStardust(g, now) {
        const t = now * 0.001;
        for (const s of this.stardust) {
          s.y -= s.speed * 16;
          if (s.y < 0) s.y = 1;
          const alpha = 0.25 + 0.6 * Math.sin(t * 2.2 + s.phase);
          if (alpha <= 0.05) continue;
          g.fillStyle = s.gold ? `rgba(255, 215, 0, ${alpha * 0.65})` : `rgba(255, 255, 255, ${alpha * 0.5})`;
          g.beginPath();
          g.arc(s.x * this.W, s.y * this.H, s.r, 0, Math.PI * 2);
          g.fill();
        }
      }

      render(B, now, st) {
        const S = st.S, L = st.letters, act = L.filter(l => !l.dead), sp = st.speed || 1;
        this.cc = st.C; this._now = now; if (st.face) this.perch = [];
        if (st.face) for (const l of L) {
          let tx = 0, ty = 0;
          const A = !l.dead && l.ch !== ' ' ? this.near(l.x, l.y - S * 0.6) : null;
          if (A) {
            const dx = A[0] - l.x, dy = A[1] - (l.y - S * 0.6), d = Math.hypot(dx, dy), reach = Math.max(260, S * 3.2);
            if (d < reach && d > 1) { const w = 1 - d / reach, s = w * w * (3 - 2 * w); tx = dx / d * s; ty = dy / d * s; }
          }
          const c = l.lean || (l.lean = [0, 0]);
          c[0] += (tx - c[0]) * 0.07; c[1] += (ty - c[1]) * 0.07;
        }
        const f = st.boil ? Math.floor(now / 120) : 0, amp = st.boil ? Math.max(0.8, S * 0.01) : 0;
        const kd = l => l.dead ? 1 - this.eo((now - l.dead) / st.wither) : 1;
        const draw = layer => {
          for (const l of L) {
            if (l.ch === ' ' || !l.els) continue;
            const age = (now - l.birth) * sp, kk = kd(l);
            const each = e => { if (e.t === 'stem') this.drawStem(B, e, l, age, kk, st, f, amp, layer); else if (e.layer === layer) this.drawEl(B, e, l, age, kk, st, f, amp); };
            l.els.forEach(each);
            if (l.endEls) l.endEls.forEach(each);
            const i = act.indexOf(l), nx = i >= 0 ? act[i + 1] : null;
            if (l.tend && (l.dead || !nx || nx.ch === ' ')) {
              let fr = this.eo(((now - l.tb) * sp - 150) / 450);
              if (l.cut != null) fr *= 1 - this.eo((now - l.cut) * sp / 150) * Math.min(0.85, st.recoil / (0.6 * S));
              for (const e of l.tend) this.drawStem(B, e, l, age, kk, st, f, amp, layer, fr * kk);
            }
          }
        };
        draw(0);
        for (const l of L) if (l.ch !== ' ' && (st.textAll || !l.dead)) B.text(l.ch, l.x, l.y, S, st.C.text);
        draw(1);
      }

      wpt(st, l, x, y) {
        if (l.birth != null && this._now != null) {
          const t = (this._now - l.birth) * (st.speed || 1) / 1000;
          if (t > 0 && t < 2.5) {
            const hh = Math.max(0, (l.y - y) / st.S), dmp = Math.exp(-t * 3.2), dir = (l.id % 2 ? 1 : -1);
            x += st.S * 0.07 * hh * dmp * Math.sin(t * 11) * dir;
            y += st.S * 0.035 * hh * dmp * Math.sin(t * 11 + 1.2);
          }
        }
        if (st.face && l.lean) {
          const hh = Math.min(2.5, Math.max(0, (l.y - y) / st.S)), f = hh * hh * 0.5 + hh * 0.5;
          x += l.lean[0] * st.S * 0.1 * f;
          y += l.lean[1] * st.S * 0.05 * f;
        }
        return st.warp ? st.warp(x, y, l) : [x, y];
      }

      drawStem(B, e, l, age, kk, st, f, amp, layer, frO) {
        const S = st.S, fr = frO != null ? frO : this.eo((age - e.d0) / e.dur) * kk; if (fr <= 0) return;
        const j = this.jit(e.id, f, amp);
        const P = e.pts.map(p => this.wpt(st, l, l.x + p[0] * S + j[0], l.y + p[1] * S + j[1]));
        for (const sg of e.segs) {
          if (sg.layer !== layer) continue;
          const b = Math.min(sg.u1, fr); if (b <= sg.u0) continue;
          this.strokeRange(B, P, sg.u0, b, st.C.blue, S * 0.022 * (e.w || 1));
        }
        for (const th of e.thorns) if (fr > th.u && this.layerAt(e.segs, th.u) === layer) this.thorn(B, P, th.u, th.s, S);
      }

      drawEl(B, e, l, age, kk, st, f, amp) {
        const S = st.S, j = this.jit(e.id, f, amp), wx = (x, y) => this.wpt(st, l, l.x + x * S + j[0], l.y + y * S + j[1]);
        const rw = st.rotw ? st.rotw(e) : 0;
        if (e.t === 'leaf') {
          const sc = this.spr((age - e.d0) / 1000, 7, 15) * kk; if (sc <= 0) return;
          const p = wx(e.x, e.y); this.leaf(B, p[0], p[1], e.a + j[2] + rw, e.L * S * sc, e.bend);
        } else if (e.t === 'flower' || e.t === 'rose') {
          const a = age - e.d0; if (a < 0) return;
          if (kk <= 0.001) return;
          const p = wx(e.x, e.y), tl = st.face ? this.faceTurn(e, p[0], p[1]) : null;
          if ((st.face || st.perchOn) && !l.dead && a > 700) {
            this.perch.push({ id: e.id, x: p[0], y: p[1], R: e.R * S * kk });
          }
          this.drawFlower(B, p[0], p[1], e.R * S * kk, e.rot + j[2] + rw + (tl ? tl[0] * 0.22 : 0), e, a, tl, e.ftype);
        }
      }

      // ---------- Poster View ----------
      preset() {
        return this.PRESETS.find(p => p.id === this.state.preset) || this.PRESETS[0];
      }
      buildPoster() {
        if (!this.g) return;
        const s = this.state, pr = this.preset(), text = (s.text || '').slice(0, 40) || ' ';
        this.rand = this.rng(s.seed * 7919 + 1);
        const L = []; let prev = null, uid = 1;
        for (const ch of text) {
          if (ch === ' ') { const sp = { ch: ' ', id: 9000 + uid++, els: [] }; L.push(sp); prev = sp; continue; }
          const same = prev && prev.ch !== ' ';
          const l = { ch, id: 9000 + uid++, ws: same ? prev.ws : Math.floor(this.rand() * 1e9), wi: same ? prev.wi + 1 : 0, prev: same ? prev : null };
          this.gen(l); L.push(l); prev = l;
        }
        const n = L.length;
        const step = pr.id === 'grow' ? Math.min(110, 3000 / n) : pr.id === 'typed' ? Math.min(85, 3600 / n) : 0;
        const off = pr.id === 'grow' ? 200 : pr.id === 'typed' ? 300 : 0;
        L.forEach((l, i) => { l.b = off + i * step; });
        if (pr.id === 'scatter') { const r = this.rng(s.seed * 31 + 5); L.forEach(l => { l.b = 150 + r() * 2400; }); }
        const wd = Math.min(60, 900 / n);
        L.forEach((l, i) => {
          l.d = pr.id === 'scatter' ? 4700 + i * 8 : 4200 + (n - 1 - i) * wd;
          const nx = L[i + 1];
          l.cutRel = null;
          if (pr.id !== 'scatter' && l.ch !== ' ' && nx && nx.ch === ' ') {
            l.cutRel = Math.max(30, nx.b - l.b);
            this.genEnd(l, l.cutRel);
          }
        });
        this.rand = Math.random;
        const res = this.layoutCore(L, 1080, 1080, false);
        let S = res.S, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        const addP = (l, x, y, r) => {
          const X = l.tx + x * S, Y = l.ty + y * S, R = (r || 0) * S;
          x0 = Math.min(x0, X - R); x1 = Math.max(x1, X + R); y0 = Math.min(y0, Y - R); y1 = Math.max(y1, Y + R);
        };
        for (const l of L) {
          if (l.ch === ' ') continue;
          addP(l, -l.tw / S / 2, -0.75); addP(l, l.tw / S / 2, 0.1);
          const all = [...l.els, ...(l.endEls || [])];
          for (const e of all) {
            if (e.t === 'stem') e.pts.forEach(q => addP(l, q[0], q[1], 0.02));
            else if (e.t === 'leaf') addP(l, e.x, e.y, e.L);
            else addP(l, e.x, e.y, e.R * 1.15);
          }
        }
        let tx0 = 1e9, tx1 = -1e9, ty0 = 1e9, ty1 = -1e9;
        for (const l of L) if (l.ch !== ' ') {
          tx0 = Math.min(tx0, l.tx - l.tw / 2); tx1 = Math.max(tx1, l.tx + l.tw / 2);
          ty0 = Math.min(ty0, l.ty - 0.72 * S); ty1 = Math.max(ty1, l.ty);
        }
        const Z = 1080, half = Z * 0.44, bcx = (tx0 + tx1) / 2, bcy = (ty0 + ty1) / 2;
        const k = Math.min(1.25, half / Math.max(1, bcx - x0, x1 - bcx), half / Math.max(1, bcy - y0, y1 - bcy));
        L.forEach(l => {
          l.tx = Z / 2 + (l.tx - bcx) * k;
          l.ty = Z / 2 + (l.ty - bcy) * k;
          l.tw *= k; l.x = l.tx; l.y = l.ty;
        });
        this.P = { letters: L, S: S * k, T: pr.T, preset: pr.id };
        this.pt0 = performance.now();
      }

      posterFly(B, tt, P, C) {
        const ps = this.perch.slice().sort((a, b) => a.x - b.x);
        if (!ps.length) return;
        const p1 = ps[Math.floor(ps.length * 0.25)], p2 = ps[Math.min(ps.length - 1, Math.floor(ps.length * 0.75))];
        const A = [-80, 300], s1 = [p1.x, p1.y - p1.R * 0.55], s2 = [p2.x, p2.y - p2.R * 0.55], E = [1160, 260];
        const sz = Math.max(12, P.S * 0.09), t = tt / 1000, eo = v => this.eo(Math.max(0, Math.min(1, v)));
        const leg = (a, b, u, lift) => { const e = eo(u); return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(e * Math.PI) * lift]; };
        let p, flying = true, vx = 0;
        if (t < 1.8) { p = leg(A, s1, t / 1.8, 160); vx = 1; }
        else if (t < 3.4) { p = s1; flying = false; }
        else if (t < 4.6) { p = leg(s1, s2, (t - 3.4) / 1.2, 140); vx = s2[0] > s1[0] ? 1 : -1; }
        else if (t < 5.8) { p = s2; flying = false; }
        else { p = leg(s2, E, (t - 5.8) / 1.2, 60); vx = 1; }
        let o, ang;
        if (flying) { o = Math.abs(Math.cos(t * 17)); p = [p[0] + Math.sin(t * 7) * 6, p[1] + Math.sin(t * 13) * 4]; ang = vx * 0.3; }
        else { const burst = (t > 2.4 && t < 2.8) || (t > 5 && t < 5.3); o = burst ? 0.2 + 0.8 * Math.abs(Math.cos(t * 9)) : 0.3 + 0.1 * Math.sin(t * 3); ang = 0; }
        this.butterfly(B, p[0], p[1], sz, ang, o, C);
      }
      drawBg(g, Z) { g.fillStyle = this.pal().bg; g.fillRect(0, 0, Z, Z); }
      bars(B, P, st, spread, hf) {
        const S = P.S, byLine = {};
        for (const l of P.letters) { if (l.ch === ' ') continue; const b = byLine[l.line] || (byLine[l.line] = { a: 1e9, z: -1e9, y: l.ty }); b.a = Math.min(b.a, l.tx - l.tw / 2); b.z = Math.max(b.z, l.tx + l.tw / 2); }
        const w = Math.max(2, S * 0.035), h = 1.0 * S * hf;
        for (const k in byLine) {
          const b = byLine[k], cx = (b.a + b.z) / 2, half = (b.z - b.a) / 2 + 0.14 * S, cy = b.y - 0.33 * S;
          B.rect(cx - half * spread - w / 2, cy - h / 2, w, h, st.C.text);
          B.rect(cx + half * spread - w / 2, cy - h / 2, w, h, st.C.text);
        }
      }

      posterDraw(g, t) {
        const P = this.P; if (!P) return;
        const Z = 1080, pc = this.pal();
        g.setTransform(1, 0, 0, 1, 0, 0);
        this.drawBg(g, Z);

        // Poster Stardust
        const pnow = t * 0.001;
        for (const s of this.stardust) {
          const sy = (s.y - (t * 0.00004)) % 1;
          const y = sy < 0 ? sy + 1 : sy;
          const alpha = 0.2 + 0.5 * Math.sin(pnow * 2.2 + s.phase);
          g.fillStyle = s.gold ? `rgba(255, 215, 0, ${alpha * 0.6})` : `rgba(255, 255, 255, ${alpha * 0.4})`;
          g.beginPath();
          g.arc(s.x * Z, y * Z, s.r * 1.3, 0, Math.PI * 2);
          g.fill();
        }

        const tt = ((t % P.T) + P.T) % P.T, L = P.letters, B = this.backend(g);
        const st = { letters: L, S: P.S, C: pc.C, boil: this.props.boil ?? true, recoil: this.props.recoil ?? 20, speed: 1, wither: 600, textAll: true };
        L.forEach(l => { l.x = l.tx; l.y = l.ty; l.dead = null; });
        const set = base => L.forEach(l => { l.birth = base + l.b; l.tb = l.birth; l.cut = l.cutRel != null ? l.birth + l.cutRel : null; });
        let bars = null;

        if (P.preset === 'cosmic') {
          set(-1e5);
          const ph = tt / P.T * Math.PI * 2, S = P.S;
          st.warp = (x, y, l) => {
            const h = Math.max(0, (l.y - y) / S);
            const wave = Math.sin(ph + (x * 0.0035)) * S * 0.045 * h;
            const vert = Math.cos(ph + (l.x * 0.004)) * S * 0.02 * h;
            return [x + wave, y + vert];
          };
          st.rotw = e => Math.sin(ph + e.id * 0.8) * 0.18;
        } else if (P.preset === 'breathe') {
          set(-1e5);
          const ph = tt / P.T * Math.PI * 2, S = P.S;
          st.warp = (x, y, l) => { const h = Math.max(0, (l.y - y) / S); return [x + Math.sin(ph + l.x * 0.004 + h * 1.1) * S * 0.03 * h, y + Math.cos(ph + x * 0.003) * S * 0.008 * h]; };
          st.rotw = e => Math.sin(ph + e.id * 0.7) * 0.12;
        } else if (P.preset === 'grow' || P.preset === 'scatter') {
          set(0);
          L.forEach(l => { if (tt >= l.d) l.dead = l.d; });
        } else if (P.preset === 'wind') {
          set(-1e5);
          const S = P.S, u = tt / P.T, front = -0.35 + u * 1.9;
          st.warp = (x, y, l) => {
            const hh = Math.max(0, (l.y - y) / S), d = l.x / 1080 - front;
            const g = d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30);
            const idle = Math.sin(tt / 1000 * 1.6 + l.x * 0.01) * 0.012;
            return [x + (g * 0.13 + idle) * S * hh * hh * 0.6 + (g * 0.13 + idle) * S * hh * 0.4, y + Math.abs(g) * 0.02 * S * hh];
          };
          st.rotw = e => { const d = e.x / 1080 - front; return (d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30)) * 0.35; };
        } else if (P.preset === 'reach') {
          set(-1e5);
          const S = P.S, ph = tt / P.T * Math.PI * 2, lx = 540 + Math.sin(ph) * 430, ly = 540 + Math.sin(ph * 2) * 260;
          this._light = [lx, ly];
          st.warp = (x, y, l) => {
            const dx = lx - l.x, dy = ly - (l.y - S * 0.6), d = Math.hypot(dx, dy) || 1, w = Math.max(0, 1 - d / 560), s = w * w * (3 - 2 * w);
            const hh = Math.min(2.5, Math.max(0, (l.y - y) / S)), f = hh * hh * 0.5 + hh * 0.5;
            return [x + dx / d * s * S * 0.12 * f, y + dy / d * s * S * 0.06 * f];
          };
          st.rotw = e => { const a = Math.atan2(ly - e.y, lx - e.x); return Math.sin(a) * 0.15; };
        } else if (P.preset === 'visit') {
          set(-1e5);
          st.perchOn = true; this.perch = [];
          const ph = tt / P.T * Math.PI * 2;
          st.warp = (x, y, l) => { const hh = Math.max(0, (l.y - y) / P.S); return [x + Math.sin(ph + l.x * 0.004 + hh) * P.S * 0.015 * hh, y]; };
        } else {
          if (tt >= 4400) return;
          set(0);
          st.letters = L.filter(l => tt >= l.birth);
          st.textAll = false;
        }

        this.render(B, tt, st);
        if (bars != null) this.bars(B, P, st, bars, 1);
        if (P.preset === 'reach') {
          const [lx, ly] = this._light, r = P.S * 0.09, pts = [];
          for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2; pts.push([lx + Math.cos(a) * r, ly + Math.sin(a) * r]); }
          B.fill(pts, st.C.line);
        }
        if (P.preset === 'visit') this.posterFly(B, tt, P, st.C);
        if (P.preset === 'typed') {
          const born = st.letters, last = born[born.length - 1], S = P.S;
          if (Math.floor(tt / 400) % 2 === 0 || (last && tt - last.birth < 300)) {
            const x = last ? last.tx + last.tw / 2 + 0.07 * S : 540, y = last ? last.ty - 0.33 * S : 540, w = Math.max(2, S * 0.03), h = 0.8 * S;
            B.rect(x - w / 2, y - h / 2, w, h, st.C.text);
          }
        }
      }

      // ---------- Export Functions ----------
      dl(blob, name) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
      savePNG() {
        this.paint(performance.now(), false);
        this.cv.toBlob(b => b && this.dl(b, 'garden.png'));
      }
      saveSVG() {
        const parts = [], n = v => Math.round(v * 100) / 100;
        const pb = () => ({
          d: '',
          moveTo(x, y) { this.d += `M${n(x)} ${n(y)}`; },
          lineTo(x, y) { this.d += `L${n(x)} ${n(y)}`; },
          quadraticCurveTo(a, b, x, y) { this.d += `Q${n(a)} ${n(b)} ${n(x)} ${n(y)}`; },
          closePath() { this.d += 'Z'; }
        });
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const B = {
          fill: (p, col) => { const b = pb(); this.path(b, p, true); parts.push(`<path d="${b.d}" fill="${col}"/>`); },
          stroke: (p, col, w) => { const b = pb(); this.path(b, p, false); parts.push(`<path d="${b.d}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`); },
          rect: () => {},
          text: (ch, x, y, S, col) => {
            parts.push(`<text x="${n(x)}" y="${n(y)}" text-anchor="middle" font-family="${this.F}" font-weight="700" font-size="${n(S)}" fill="${col}">${esc(ch)}</text>`);
          }
        };
        this.render(B, performance.now(), this.mainState());
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${n(this.W)}" height="${n(this.H)}" viewBox="0 0 ${n(this.W)} ${n(this.H)}"><rect width="100%" height="100%" fill="${this.pal().bg}"/>${parts.join('')}</svg>`;
        this.dl(new Blob([svg], { type: 'image/svg+xml' }), 'garden.svg');
      }

      fname() {
        return 'garden-' + (this.state.text || 'loop').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 24) + '-' + this.state.preset;
      }
      async exportVideo() {
        if (!this.vmime || this.state.busy) {
          this.exportStatus.textContent = 'Video export isn’t supported in this browser — use PNG frames.';
          return;
        }
        const P = this.P, c = document.createElement('canvas'); c.width = c.height = 1080;
        const g = c.getContext('2d'), stream = c.captureStream(0), track = stream.getVideoTracks()[0];
        const rec = new MediaRecorder(stream, { mimeType: this.vmime, videoBitsPerSecond: 14e6 }), chunks = [];
        rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
        const done = new Promise(r => { rec.onstop = r; });
        this.state.busy = true;
        this.exportStatus.textContent = 'Recording video…';
        this.posterDraw(g, 0); rec.start();
        const N = Math.round(P.T / 1000 * 30), wait = ms => new Promise(r => setTimeout(r, ms));
        const t0 = performance.now();
        for (let i = 0; i < N; i++) {
          this.posterDraw(g, i * 1000 / 30);
          if (track.requestFrame) track.requestFrame();
          if (i % 15 === 0) this.exportStatus.textContent = `Recording ${Math.round(i / N * 100)}%`;
          const target = t0 + (i + 1) * 1000 / 30; await wait(Math.max(0, target - performance.now()));
        }
        rec.stop(); await done;
        const ext = this.vmime.includes('mp4') ? 'mp4' : 'webm';
        this.dl(new Blob(chunks, { type: this.vmime.split(';')[0] }), `${this.fname()}.${ext}`);
        this.state.busy = false;
        this.exportStatus.textContent = `Saved ${ext.toUpperCase()} · ${N} frames`;
      }

      async exportFrames() {
        if (this.state.busy) return;
        const P = this.P, c = document.createElement('canvas'); c.width = c.height = 1080;
        const g = c.getContext('2d'), N = Math.round(P.T / 1000 * 30), files = [];
        this.state.busy = true;
        this.exportStatus.textContent = 'Rendering PNG frames…';
        for (let i = 0; i < N; i++) {
          this.posterDraw(g, i * 1000 / 30);
          const b = await new Promise(r => c.toBlob(r, 'image/png'));
          files.push({ name: `frame_${String(i + 1).padStart(4, '0')}.png`, data: new Uint8Array(await b.arrayBuffer()) });
          if (i % 10 === 0) this.exportStatus.textContent = `Rendering ${Math.round(i / N * 100)}%`;
        }
        this.dl(this.zip(files), `${this.fname()}-frames.zip`);
        this.state.busy = false;
        this.exportStatus.textContent = `Saved ${N} PNG frames · 30 fps (.zip)`;
      }

      zip(files) {
        const crcT = this._crcT || (this._crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })());
        const crc = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
        const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
        for (const f of files) {
          const nm = enc.encode(f.name), cr = crc(f.data), sz = f.data.length;
          const h = new DataView(new ArrayBuffer(30));
          h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, 0, true); h.setUint16(12, 33, true);
          h.setUint32(14, cr, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
          parts.push(h.buffer, nm, f.data);
          const c = new DataView(new ArrayBuffer(46));
          c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(14, 33, true);
          c.setUint32(16, cr, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
          cen.push(c.buffer, nm);
          off += 30 + nm.length + sz;
        }
        const cs = cen.reduce((s, b) => s + (b.byteLength || b.length), 0);
        const e = new DataView(new ArrayBuffer(22));
        e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
        return new Blob([...parts, ...cen, e.buffer], { type: 'application/zip' });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.typeGarden = new TypeGarden();
    });
  </script>
</body>
