<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 180" width="830" height="180">
  <defs>
    <linearGradient id="snk_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081e33"/>
      <stop offset="100%" stop-color="#051322"/>
    </linearGradient>
    <clipPath id="snk_card"><rect width="830" height="180" rx="18"/></clipPath>
    <filter id="snk_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .snk-s { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Verdana, Arial, sans-serif; }
    .snk-m { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
  </style>

  <g clip-path="url(#snk_card)">
    <rect width="830" height="180" fill="url(#snk_bg)"/>
    <text x="32" y="32" class="snk-s" font-size="15" font-weight="700" fill="#f0f9ff">Adarsh's Contribution Snake Grid</text>
    <text x="798" y="32" text-anchor="end" class="snk-m" font-size="12" fill="#38bdf8">🐍 eating commits daily</text>

    <!-- Contribution Grid (52 Weeks x 7 Days) -->
    <g transform="translate(32, 52)">
      <pattern id="snk_grid_cells_d" width="14.6" height="14.6" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#0f2942" stroke="#133654" stroke-width="0.5"/>
      </pattern>
      <rect x="0" y="0" width="765" height="102" fill="url(#snk_grid_cells_d)"/>

      <!-- Active Contribution Blocks -->
      <g fill="#065f46">
        <rect x="29.2" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="73.0" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="116.8" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="160.6" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="204.4" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="248.2" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="292.0" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="335.8" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="379.6" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="423.4" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="467.2" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="511.0" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="554.8" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="598.6" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="642.4" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="686.2" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="730.0" y="58.4" width="11" height="11" rx="2.5"/>
      </g>

      <g fill="#10b981">
        <rect x="43.8" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="87.6" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="131.4" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="175.2" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="219.0" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="262.8" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="306.6" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="350.4" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="394.2" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="438.0" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="481.8" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="525.6" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="569.4" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="613.2" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="657.0" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="700.8" y="43.8" width="11" height="11" rx="2.5"/>
      </g>

      <g fill="#38bdf8">
        <rect x="58.4" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="102.2" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="146.0" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="189.8" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="233.6" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="277.4" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="321.2" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="365.0" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="408.8" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="452.6" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="496.4" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="540.2" y="73.0" width="11" height="11" rx="2.5"/>
        <rect x="584.0" y="0.0" width="11" height="11" rx="2.5"/>
        <rect x="627.8" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="671.6" y="58.4" width="11" height="11" rx="2.5"/>
        <rect x="715.4" y="14.6" width="11" height="11" rx="2.5"/>
      </g>

      <g fill="#34d399" filter="url(#snk_glow)">
        <rect x="189.8" y="29.2" width="11" height="11" rx="2.5"/>
        <rect x="365.0" y="43.8" width="11" height="11" rx="2.5"/>
        <rect x="540.2" y="14.6" width="11" height="11" rx="2.5"/>
        <rect x="671.6" y="43.8" width="11" height="11" rx="2.5"/>
      </g>

      <!-- Animated Snake -->
      <g filter="url(#snk_glow)">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0,0; 146,0; 292,29.2; 438,0; 584,29.2; 730,0; 0,0"
            dur="8s" repeatCount="indefinite"/>
          <rect x="43.8" y="29.2" width="11" height="11" rx="3.5" fill="#7dd3fc"/>
          <circle cx="51" cy="32" r="1.2" fill="#030712"/>
          <circle cx="51" cy="37" r="1.2" fill="#030712"/>
          <rect x="29.2" y="29.2" width="11" height="11" rx="2.5" fill="#38bdf8"/>
          <rect x="14.6" y="29.2" width="11" height="11" rx="2.5" fill="#34d399"/>
          <rect x="0.0" y="29.2" width="11" height="11" rx="2.5" fill="#10b981"/>
          <rect x="-14.6" y="29.2" width="11" height="11" rx="2.5" fill="#059669"/>
        </g>
      </g>
    </g>

    <rect x="1" y="1" width="828" height="178" rx="17" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
</svg>
